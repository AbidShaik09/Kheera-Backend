services:

  kheera-backend:
    build: .

    container_name: kheera-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://kheera.theknightdevelopers.online}

    ports:
      - "8080:8080"

    networks:
      - app-network

networks:
  app-network:
    external: true
