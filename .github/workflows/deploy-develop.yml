name: Deploy Backend Development

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-backend-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Deploy to Development Folder
        run: |
          set -euo pipefail

          cd /opt/apps/develop/kheera-backend/Kheera-Backend

          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

          chmod +x mvnw

          ./mvnw clean package

          docker compose -f docker-compose.dev.yml down

          docker compose -f docker-compose.dev.yml up -d --build
