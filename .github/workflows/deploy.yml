name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Deploy to Production Folder
        run: |
          set -euo pipefail

          cd /opt/apps/prod/kheera-backend/Kheera-Backend

          git fetch origin main
          git merge --ff-only origin/main

          chmod +x mvnw

          ./mvnw clean package

          docker compose down

          docker compose up -d --build
