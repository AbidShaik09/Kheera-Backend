services:

  kheera-backend-dev:
    build: .

    container_name: kheera-backend-dev

    restart: unless-stopped

    env_file:
      - .env.dev

    environment:
      CORS_ALLOWED_ORIGINS: ${DEV_CORS_ALLOWED_ORIGINS:-https://dev.kheera.theknightdevelopers.online}

    ports:
      - "8081:8080"

    networks:
      - app-network

networks:
  app-network:
    external: true
